# Devhot 站点静态服务响应头与缓存基线配置。
#
# 本文件是 #78 固化的跨浏览器发布基线：`npm run gate` 通过
# tools/verify-serving.ts 验证本文件声明的安全响应头、缓存策略和端口模型，
# 并由 tests/browser/nginx-runtime.test.ts 用真实固定版本 Nginx 检查 HTTP
# 响应。#82–#84 的部署包必须原样挂载本文件与 security-headers.conf，不得
# 在本文件之外另行改写安全头或缓存指令；修改必须走代码 PR 与完整门禁。
#
# Nginx add_header 继承规则：location 内任何 add_header 都会阻断 server
# 层 add_header 的继承，因此每个缓存 location 都重复 include
# security-headers.conf（片段见该文件说明）。

# 哈希资源缓存策略：带 Range 的请求（206 部分内容或 416 越界）一律重验证，
# 避免越界错误被长期缓存；普通成功响应与条件响应保持 immutable。
map $http_range $hashed_cache_control {
    default            "public, max-age=31536000, immutable";
    ~.+                "no-cache, must-revalidate";
}

# 非特权监听端口；主机侧 80 由 RootlessKit 受限映射，不在容器内以 root 监听。
server {
    listen 8080;

    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # server 层兜底：未命中任何 location 的响应（如 404）也带全部安全头。
    include deploy/security-headers.conf;

    # ADR 0221：HTML 与版本元数据每次使用前重验证，不设长期新鲜期。
    location / {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location = /release.json {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /_publication.json {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /maintenance/ {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 内容寻址资源：字节不可变，公开长期缓存并标记 immutable。
    # 命中文件的 200 响应才长期缓存；缺失资源的 404 响应不进本 location，
    # 由下方 error_page 内层 location 统一按重验证处理，绝不被缓存一年。
    location /media/sha256/ {
        include deploy/security-headers.conf;
        add_header Cache-Control $hashed_cache_control always;
    }

    # 构建器输出的带哈希静态资源（/_astro/）同样按不可变处理。
    location /_astro/ {
        include deploy/security-headers.conf;
        add_header Cache-Control $hashed_cache_control always;
    }

    # 哈希资源路径下的一切错误响应（4xx/5xx 全集，含缺失 404、不可读 403、
    # 方法 405、前置条件失败 412、越界 Range 416、服务器 5xx 等）一律经
    # error_page 内部重定向到 @hashed_error：重验证 + 全部安全头。成功响应
    # 与适用的条件响应（200/206/304）仍按 immutable 处理；按最终状态分流，
    # 不逐一枚举本轮发现的错误码，绝不允许 immutable 出现在错误响应上。
    # 416 的响应头过滤阶段 nginx 可能重复追加同名头，由 map($http_range)
    # 在源头对带 Range 的请求先行分流，避免 immutable 泄漏。
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 @hashed_error;

    location @hashed_error {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 时间线片段 JSON 是无哈希稳定路径，按重验证处理。
    location /timeline/fragments/ {
        include deploy/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

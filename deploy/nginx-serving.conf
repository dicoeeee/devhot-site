# Devhot 站点静态服务响应头与缓存基线配置。
#
# 本文件是 #78 固化的跨浏览器发布基线：`npm run gate` 通过
# tools/verify-serving.ts 逐条验证本文件声明的安全响应头、缓存策略和
# 端口模型。#82–#84 的部署包必须原样挂载本文件，不得在本文件之外
# 另行改写安全头或缓存指令；修改本文件必须走代码 PR 与完整门禁。

# 非特权监听端口；主机侧 80 由 RootlessKit 受限映射，不在容器内以 root 监听。
server {
    listen 8080;

    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ADR 0222：仅允许自身资源的 CSP 与安全响应头；HTTP 阶段禁止 HSTS。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; worker-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ADR 0221：HTML 与版本元数据每次使用前重验证，不设长期新鲜期。
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /release.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /_publication.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /maintenance/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 内容寻址资源：字节不可变，公开长期缓存并标记 immutable。
    location /media/sha256/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 构建器输出的带哈希静态资源（/_astro/）同样按不可变处理。
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 时间线片段 JSON 是无哈希稳定路径，按重验证处理。
    location /timeline/fragments/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

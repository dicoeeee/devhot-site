# Devhot 安全响应头片段。
#
# ADR 0222：仅允许自身资源的 CSP 与安全响应头；HTTP 阶段禁止 HSTS。
# ADR 0242/#98：connect-src 允许同源（时间线意图加载），禁止第三方 connect。
#
# 注意：Nginx 的 add_header 继承规则是“任一层级声明 add_header 就不再继承
# 上一层级”。因此每个声明了 add_header（如 Cache-Control）的 location 都
# 必须 include 本片段，否则 server 层安全头会丢失。tools/verify-serving.ts
# 与真实 Nginx 运行时测试共同守护这一不变量。

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; worker-src 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

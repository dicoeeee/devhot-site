name: repository-gate

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

jobs:
  gate:
    name: npm run gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify runtime version
        run: test "$(node --version)" = "v24.19.0"

      - name: Install Bash and Git for repository fixtures
        run: apk add --no-cache bash git

      - name: Install locked dependencies
        run: npm ci

      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: npx tsx tools/validate-pull-request.ts

      - name: Run the single repository gate
        run: npm run gate
